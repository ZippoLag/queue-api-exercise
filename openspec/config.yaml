schema: spec-driven

# Project context (shown to AI when creating artifacts)
context: |
  Tech stack: .NET 9 (C#), ASP.NET Core minimal APIs, EF Core over SQLite.
  Architecture: modular monolith, Clean Architecture + ports/adapters, CQRS (writes/reads separated), Event-Driven outbox.
  Conventions: XML doc comments required (what/why); xUnit + Moq + FluentAssertions; Serilog or leveled Console logging.
  Source: src/<project> (CmsWebhook.*, Shared/QueueApi.Auth); tests under tests/<project>.
  Domain: see docs/dsl_glossary.md and docs/architecture.md.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
